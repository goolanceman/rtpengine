[rtpengine-recording]

# Must match test daemon --table=
table = 44

log-level = 5

output-storage = file
output-format = wav

# Separate spool so we never touch production /var/spool/recording
spool-dir = /var/spool/recording-test-12.5

output-dir = /tmp/recordings-test-12.5
output-pattern = %Y%m%d%H00/test-%c-%t

resample-to = 8000
output-mixed = true
mix-method = channels
