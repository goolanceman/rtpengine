[rtpengine-recording]

# Mirrors production /etc/rtpengine-recording.ini except isolation fields:
#   table, spool-dir, output-dir, output-pattern prefix
# Prod keeps table=42 spool=/var/spool/recording output=/tmp/recordings

# MUST match test daemon --table= (prod uses 42)
table = 44

log-level = 5

### number of worker threads (default 8)
# num-threads = 16

### where to forward to (unix socket)
# forward-to = /run/rtpengine/sock

### where to store recordings: file (default), db, both
output-storage = file

### format of stored recordings: wav (default), mp3
# output-format = mp3
# output-format = pcma
output-format = wav

### directory containing rtpengine metadata files
# PROD: /var/spool/recording
spool-dir = /var/spool/recording-test-12.5

### where to store media files to
# PROD: /tmp/recordings
output-dir = /tmp/recordings-test-12.5

### File name pattern (same shape as prod; test- prefix so files are obvious)
# PROD: %Y%m%d%H00/rtpengine-%c-%t-M%S%u
output-pattern = %Y%m%d%H00/test-%c-%t-M%S%u

### resample all output audio
resample-to = 8000

### bits per second for MP3 encoding
# mp3_bitrate = 24000

### mix participating sources into a single output
output-mixed = true

### create one output file for each source
# output-single = false

### mix method: direct (mix input) channels (multi-channel)
mix-method = channels

### mysql configuration for db storage
# mysql-host = localhost
# mysql-port = 3306
# mysql-user = rtpengine
# mysql-pass = secret
# mysql-db = rtpengine
