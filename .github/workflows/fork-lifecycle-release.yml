name: Fork Lifecycle Release

on:
  push:
    tags:
      - 'goolanceman-*'

jobs:
  tests:
    runs-on: ubuntu-24.04
    name: Run unit tests (asan)

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update APT cache
        run: |
          sudo apt-get update

      - name: Install build dependencies
        run: |
          echo "Generating Debian source for usage on Ubuntu/noble / ubuntu-24.04"
          cd pkg/deb/
          ./generator.sh
          ./backports/noble
          rm -rf debian
          mv noble debian
          echo "Installing Debian packages"
          sudo apt-get build-dep -q -y .

      - name: Run unit tests with sanitizers enabled
        run: |
          make asan-check

  build-binaries:
    needs: tests
    runs-on: ubuntu-24.04
    name: Build rtpengine binaries

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Update APT cache
        run: |
          sudo apt-get update

      - name: Install build dependencies
        run: |
          echo "Generating Debian source for usage on Ubuntu/noble / ubuntu-24.04"
          cd pkg/deb/
          ./generator.sh
          ./backports/noble
          rm -rf debian
          mv noble debian
          echo "Installing Debian packages"
          sudo apt-get build-dep -q -y .

      - name: Build rtpengine binaries
        run: |
          make -j"$(nproc)"
          mkdir -p artifacts
          cp daemon/rtpengine artifacts/rtpengine || true
          cp recording-daemon/rtpengine-recording artifacts/rtpengine-recording || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ github.ref_name }}
          path: artifacts/

  attach-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    name: Attach binaries to GitHub Release

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
